name: Staging privacy SQL policies
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "tests/security/**"
      - ".github/workflows/security-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls-regression:
    name: Synthetic PostgreSQL RLS regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic Supabase-style schema
        run: psql -X -v ON_ERROR_STOP=1 -f tests/security/bootstrap.sql
      - name: Apply privacy migration to synthetic database
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261018050000_stage_private_dump_media_and_membership.sql
      - name: Verify RLS for three synthetic identities
        run: psql -X -v ON_ERROR_STOP=1 -f tests/security/assertions.sql
