      <use href="#walk2" x="192"/>
      <use href="#walk3" x="288"/>
      <use href="#walk4" x="384"/>
      <use href="#walk5" x="480"/>
      <use href="#sit0" x="576"/>
      <use href="#sit1" x="672"/>
    </g>

    <g id="santa">
      <rect x="44" y="13" width="27" height="6" fill="#c83f46"/>
      <rect x="50" y="7" width="21" height="7" fill="#c83f46"/>
      <rect x="58" y="3" width="12" height="5" fill="#c83f46"/>
      <rect x="46" y="17" width="27" height="4" fill="#f2e9df"/>
      <rect x="64" y="2" width="6" height="6" fill="#f2e9df"/>
      <rect x="26" y="40" width="40" height="12" fill="#c83f46"/>
      <rect x="52" y="40" width="4" height="12" fill="#f2e9df"/>
      <rect x="24" y="50" width="44" height="4" fill="#f2e9df"/>
    </g>

    <g id="ghost">
      <rect x="10" y="24" width="70" height="34" fill="#e8edf7"/>
      <rect x="16" y="18" width="57" height="39" fill="#eef1f8"/>
      <rect x="49" y="27" width="7" height="8" fill="#303541"/>
      <rect x="15" y="54" width="13" height="5" fill="#eef1f8"/>
      <rect x="34" y="52" width="15" height="7" fill="#eef1f8"/>
      <rect x="55" y="53" width="13" height="6" fill="#eef1f8"/>
      <rect x="72" y="52" width="8" height="7" fill="#eef1f8"/>
      <rect x="11" y="57" width="69" height="3" fill="#8a93a5"/>
    </g>

    <g id="witch">
      <rect x="46" y="13" width="28" height="6" fill="#53317a"/>
      <rect x="53" y="6" width="20" height="9" fill="#53317a"/>
      <rect x="60" y="0" width="10" height="8" fill="#53317a"/>
      <rect x="45" y="19" width="31" height="4" fill="#df9b43"/>
      <rect x="25" y="41" width="39" height="15" fill="#53317a"/>
      <rect x="31" y="49" width="24" height="7" fill="#6b4192"/>
      <rect x="51" y="43" width="5" height="12" fill="#df9b43"/>
    </g>

    <g id="valentine">
      <rect x="41" y="40" width="8" height="6" fill="#e45c88"/>
      <rect x="49" y="40" width="8" height="6" fill="#e45c88"/>
      <rect x="45" y="46" width="9" height="7" fill="#e45c88"/>
      <rect x="48" y="53" width="4" height="3" fill="#b63862"/>
      <rect x="49" y="18" width="5" height="6" fill="#e45c88"/>
      <rect x="42" y="19" width="7" height="4" fill="#e45c88"/>
      <rect x="54" y="19" width="7" height="4" fill="#e45c88"/>
    </g>
  </defs>

  <g transform="translate(0,0)"><use href="#frame-row"/></g>

  <g transform="translate(0,72)">
    <use href="#frame-row"/>
    <use href="#santa" x="0"/><use href="#santa" x="96"/><use href="#santa" x="192"/><use href="#santa" x="288"/>
    <use href="#santa" x="384"/><use href="#santa" x="480"/><use href="#santa" x="576"/><use href="#santa" x="672"/>
  </g>

  <g transform="translate(0,144)">
    <use href="#frame-row"/>
    <use href="#ghost" x="0"/><use href="#ghost" x="96"/><use href="#ghost" x="192"/><use href="#ghost" x="288"/>
    <use href="#ghost" x="384"/><use href="#ghost" x="480"/><use href="#ghost" x="576"/><use href="#ghost" x="672"/>
  </g>

  <g transform="translate(0,216)">
    <use href="#frame-row"/>
    <use href="#witch" x="0"/><use href="#witch" x="96"/><use href="#witch" x="192"/><use href="#witch" x="288"/>
    <use href="#witch" x="384"/><use href="#witch" x="480"/><use href="#witch" x="576"/><use href="#witch" x="672"/>
  </g>

  <g transform="translate(0,288)">
    <use href="#frame-row"/>
    <use href="#valentine" x="0"/><use href="#valentine" x="96"/><use href="#valentine" x="192"/><use href="#valentine" x="288"/>
    <use href="#valentine" x="384"/><use href="#valentine" x="480"/><use href="#valentine" x="576"/><use href="#valentine" x="672"/>
  </g>
</svg>
