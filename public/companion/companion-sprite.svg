      <rect x="21" y="52" width="11" height="14" fill="#5e3825"/>
      <rect x="56" y="51" width="11" height="15" fill="#5e3825"/>
      <rect x="20" y="64" width="13" height="3" fill="#40261b"/>
      <rect x="55" y="64" width="13" height="3" fill="#40261b"/>
    </g>

    <g id="walk1">
      <use href="#base" transform="translate(0,1)"/>
      <rect x="16" y="53" width="11" height="13" fill="#5e3825"/>
      <rect x="59" y="50" width="11" height="16" fill="#5e3825"/>
      <rect x="15" y="64" width="13" height="3" fill="#40261b"/>
      <rect x="58" y="64" width="13" height="3" fill="#40261b"/>
    </g>

    <g id="walk2">
      <use href="#base" transform="translate(0,2)"/>
      <rect x="21" y="54" width="10" height="12" fill="#5e3825"/>
      <rect x="59" y="55" width="12" height="11" fill="#5e3825"/>
      <rect x="20" y="64" width="12" height="3" fill="#40261b"/>
      <rect x="60" y="64" width="12" height="3" fill="#40261b"/>
    </g>

    <g id="walk3">
      <use href="#base" transform="translate(0,1)"/>
      <rect x="26" y="50" width="11" height="16" fill="#5e3825"/>
      <rect x="52" y="53" width="11" height="13" fill="#5e3825"/>
      <rect x="25" y="64" width="13" height="3" fill="#40261b"/>
      <rect x="51" y="64" width="13" height="3" fill="#40261b"/>
    </g>

    <g id="walk4">
      <use href="#base"/>
      <rect x="26" y="53" width="11" height="13" fill="#5e3825"/>
      <rect x="55" y="52" width="11" height="14" fill="#5e3825"/>
      <rect x="25" y="64" width="13" height="3" fill="#40261b"/>
      <rect x="54" y="64" width="13" height="3" fill="#40261b"/>
    </g>

    <g id="walk5">
      <use href="#base" transform="translate(0,1)"/>
      <rect x="19" y="51" width="11" height="15" fill="#5e3825"/>
      <rect x="59" y="53" width="10" height="13" fill="#5e3825"/>
      <rect x="18" y="64" width="13" height="3" fill="#40261b"/>
      <rect x="58" y="64" width="12" height="3" fill="#40261b"/>
    </g>

    <g id="sit0">
      <use href="#base" transform="translate(0,4)"/>
      <rect x="22" y="52" width="43" height="14" fill="#613a27"/>
      <rect x="18" y="63" width="15" height="4" fill="#40261b"/>
      <rect x="53" y="63" width="15" height="4" fill="#40261b"/>
    </g>

    <g id="sit1">
      <use href="#base" transform="translate(0,5)"/>
      <rect x="20" y="52" width="47" height="14" fill="#613a27"/>
      <rect x="16" y="63" width="17" height="4" fill="#40261b"/>
      <rect x="52" y="63" width="17" height="4" fill="#40261b"/>
