<svg xmlns="http://www.w3.org/2000/svg" width="768" height="360" viewBox="0 0 768 360">
  <defs>
    <!-- Retro 16-bit side-profile capybara. Each frame is 96x72. -->
    <g id="base">
      <rect x="16" y="64" width="59" height="3" fill="#31231b" opacity=".22"/>
      <rect x="17" y="29" width="44" height="27" fill="#8b5537"/>
      <rect x="12" y="35" width="16" height="19" fill="#79462f"/>
      <rect x="21" y="25" width="41" height="27" fill="#9f6844"/>
      <rect x="30" y="20" width="29" height="25" fill="#a97049"/>
      <rect x="51" y="25" width="23" height="24" fill="#a97049"/>
      <rect x="65" y="35" width="14" height="13" fill="#b8794e"/>
      <rect x="72" y="38" width="8" height="7" fill="#b8794e"/>
      <rect x="77" y="39" width="5" height="4" fill="#1e1510"/>
      <rect x="59" y="31" width="4" height="5" fill="#1e1510"/>
      <rect x="53" y="18" width="8" height="7" fill="#6c402b"/>
      <rect x="54" y="16" width="5" height="4" fill="#925b3b"/>
      <rect x="34" y="24" width="13" height="4" fill="#c98d5e" opacity=".7"/>
      <rect x="25" y="49" width="38" height="8" fill="#7b4930"/>
    </g>

    <g id="walk0">
